[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsecguard-ai"
version = "0.1.0"
description = "Hackathon prototype for IPsec VPN pcap risk analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "scapy==2.6.1",
  "pyshark==0.6",
  "pandas==2.3.2",
  "numpy==2.3.2",
  "scikit-learn==1.7.2",
  "xgboost==3.0.4",
  "shap==0.49.1",
  "weasyprint==68.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.30",
  "sqlalchemy==2.0.43",
  "pytest==8.4.2",
  "httpx==0.28.1",
  "matplotlib==3.10.6",
  "joblib==1.5.2",
  "ruff==0.13.0"
]

[tool.setuptools.packages.find]
include = ["ipsecguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
